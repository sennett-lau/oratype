name: Site (Cloudflare)

# Builds the one-page site in site/ and deploys it to Cloudflare Workers (site/wrangler.jsonc):
# oratype.sennettlau.me, with typelite.sennettlau.me redirecting to it (plan `rename-oratype`).
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (site/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'presets/languages/index.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, a running one finishes.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: '4.151.2'
          command: deploy
