# The offline gate from CONTRIBUTING.md, on macOS (Apple Silicon).
#
# It runs only by hand (Actions → CI → Run workflow), for example before a release. Pull
# requests do not start it; run the offline gate locally before merging (CONTRIBUTING.md).
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Also type-checks. The Rust build embeds `dist/`, so this runs first.
      - name: Build the frontend
        run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Frontend tests
        run: npx vitest run

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/

      - name: Format
        run: npx prettier --check src

      - name: Docs (format, links and generated tables)
        run: npm run docs:check

      - name: Language presets
        run: node scripts/language-presets.mjs --check

      - name: Performance baseline consistency
        run: node scripts/benchmark-baseline.mjs --check
