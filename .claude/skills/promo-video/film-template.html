<!doctype html>
<!--
  Promo film template (.claude/skills/promo-video). Copy to output/promo-<version>/film.html,
  replace every {{…}} and rewrite the shots. site/scripts/record-film.mjs records it frame by
  frame: window.render(t) must draw the frame at t seconds from t alone (no timers, no CSS
  animations, no real time), and window.DURATION is the film's length.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Typelite {{VERSION}} promo</title>
<style>
  /* 1920×1080. Brand: teal → violet on near-black, as the app's pill. */
  :root { --a: #3fd8c2; --b: #7a5cff; --ink: #f2f5fa; --mute: rgba(242, 245, 250, 0.6); --bg: #07090e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, 'PingFang HK', 'PingFang TC', 'Helvetica Neue', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .shot { position: absolute; inset: 0; display: none; overflow: hidden;
    background: radial-gradient(70% 80% at 30% 20%, rgba(63,216,194,.12), transparent 60%),
                radial-gradient(60% 70% at 85% 90%, rgba(122,92,255,.12), transparent 60%), var(--bg); }
  /* A still of the real app, placed with place(). */
  .media { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; border-radius: 18px; }
  .grad { background: linear-gradient(100deg, #b5fff2, var(--a) 40%, var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* A caption: the headline, and the line in the second language under it. */
  .head { position: absolute; left: 0; right: 0; text-align: center; }
  .head .main { font-size: 76px; font-weight: 700; letter-spacing: .5px; }
  .head .sub { margin-top: 10px; font-size: 32px; font-weight: 400; color: var(--mute); }
  .scrim { position: absolute; left: 0; right: 0; height: 330px; }
  .scrim.top { top: 0; background: linear-gradient(var(--bg) 35%, transparent); }
  .scrim.bottom { bottom: 0; background: linear-gradient(transparent, var(--bg) 65%); }
  .card { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 24px; }
  .card img { width: 160px; height: 160px; border-radius: 36px; }
  .card h1 { font-size: 112px; font-weight: 700; letter-spacing: -2px; }
  .card p { font-size: 46px; font-weight: 600; }
  .card small { font-size: 30px; color: var(--mute); }
  .card .url { font-size: 44px; font-weight: 600; }
  #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<!-- 1. Title: the version and what it brings, in a few words. -->
<section class="shot" id="s1">
  <div class="card" id="t1">
    <img src="../../src-tauri/icons/128x128@2x.png" alt="" />
    <h1>Typelite {{VERSION}}</h1>
    <p><span class="grad">{{HEADLINE}}</span></p>
    <small>{{HEADLINE_SECOND_LANGUAGE}}</small>
  </div>
</section>

<!-- 2. The feature on the real app: a still from stills/, slowly pushed in. -->
<section class="shot" id="s2">
  <img class="media" id="m2" src="stills/{{SHOT}}.png" />
  <div class="scrim top"></div>
  <div class="head" id="h2" style="top:70px"><div class="main">{{CAPTION}}</div><div class="sub">{{CAPTION_SECOND_LANGUAGE}}</div></div>
</section>

<!-- Last. End card: name, free and open source, the site. -->
<section class="shot" id="s3">
  <div class="card" id="e3">
    <img src="../../src-tauri/icons/128x128@2x.png" alt="" />
    <h1>Typelite {{VERSION}}</h1>
    <small>Free and open source · 免費 · 開源</small>
    <div class="url grad">typelite.sennettlau.me</div>
  </div>
</section>
<div id="fade"></div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const out = (x) => 1 - Math.pow(1 - clamp(x), 3)
const lerp = (a, b, k) => a + (b - a) * k
const $ = (id) => document.getElementById(id)

/** [section id, start, end] in seconds; the shots follow each other with no gap. */
const SHOTS = [['s1', 0, 2.4], ['s2', 2.4, 7.0], ['s3', 7.0, 9.0]]
window.DURATION = SHOTS[SHOTS.length - 1][2]

/** Places a still (natural w × h px) centred on screen at `scale`, with its point (fx, fy) in the centre. */
function place(el, w, h, scale, fx, fy, dy = 0) {
  el.style.width = w + 'px'; el.style.height = h + 'px'
  el.style.transform = `translate(-50%, calc(-50% + ${dy}px)) scale(${scale}) translate(${w / 2 - fx}px, ${h / 2 - fy}px)`
}
/** Fades and lifts an element in from t0 over `dur` seconds. */
function rise(el, t0, t, dur = 0.5) {
  const k = out((t - t0) / dur)
  el.style.opacity = k
  el.style.transform = `translateY(${(1 - k) * 24}px)`
}

window.render = function (t) {
  for (const [id, a, b] of SHOTS) $(id).style.display = t >= a && t < b ? 'block' : 'none'

  rise($('t1'), 0.15, t, 0.7)

  // A 2000 × 1640 settings still: push in from the window towards the feature.
  { const k = ease((t - 2.4) / 4.6)
    place($('m2'), 2000, 1640, lerp(0.74, 1.0, k), 1000, lerp(820, 900, k), 70)
    rise($('h2'), 2.55, t) }

  rise($('e3'), 7.1, t, 0.6)

  // Fade in from black, and out over the last half second.
  $('fade').style.opacity = Math.max(clamp(1 - t / 0.35), clamp((t - (window.DURATION - 0.5)) / 0.5))
}
window.ready = Promise.all([...document.images].map((im) => im.decode().catch(() => {}))).then(() => true)
render(0)
</script>
</body>
</html>
